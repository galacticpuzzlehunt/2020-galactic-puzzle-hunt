<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bent Pipes - YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        display: flex;
        justify-content: center;
      }

      body {
        background-color: #0f0f0f;
        color: rgb(241, 241, 241);
        max-width: 560px;

        font-family: "Roboto", "Arial", sans-serif;
        font-size: 1.2rem;
      }

      .banner {
        line-height: 0;
      }

      .banner img {
        border-radius: 16px;
        width: 100%;
        object-fit: cover;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 16px;
      }

      .profile img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
      }

      .channel-name {
        font-size: 36px;
        font-weight: bold;
        line-height: 50px;
      }

      .info {
        display: flex;
        font-size: 12px;
        line-height: 18px;
        gap: 4px;
        margin-top: 2px;
      }

      .info .handle {
        font-weight: 500;
      }

      .info .subs {
        color: rgb(170, 170, 170);
      }

      .desc {
        margin-top: 12px;
        font-size: 12px;
        color: rgb(170, 170, 170);
        line-height: 16px;
      }

      .subscribe {
        border: none;
        border-radius: 18px;
        background-color: rgb(241, 241, 241);
        cursor: pointer;

        font-family: "Roboto", "Arial", sans-serif;
        font-weight: 500;
        font-size: 14px;
        
        width: 100%;
        max-width: 560px;
        
        height: 36px;
        margin-top: 12px;
      }

      .subscribe:hover {
        background-color: rgb(217, 217, 217);
      }

      iframe {
        margin-top: 24px;
        border-radius: 12px;
      }

      .video-title {
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        margin-top: 16px;
        margin-bottom: 4px;
      }

      .video-stats {
        color: rgb(170, 170, 170);
        font-size: 12px;
        line-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img src="banner.jpg" />
    </div>
    <div class="profile">
      <div class="profile-left">
        <img src="profile.jpg" />
      </div>
      <div class="profile-right">
        <div class="channel-name">Bent Pipes</div>
        <div class="info">
          <div class="handle">@BentPipes</div>
          <div class="sep">•</div>
          <div class="subs">108 subscribers</div>
        </div>
        <div class="desc">https://www.youtube.com/watch?v=re1R9PWZMpM</div>
      </div>
    </div>
    <button class="subscribe">Subscribe</button>
    <iframe
      width="100%"
      height="315"
      src="https://www.youtube-nocookie.com/embed/re1R9PWZMpM?si=zmUATjI2eSB-vC4F"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <div class="video-title">2020.galacticpuzzlehunt.com/_</div>
    <div class="video-stats">79 views • 2 weeks ago</div>
  </body>
</html>
