<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@lightatorch | Tinder</title>
    <style>
      body {
        background-color: #111418;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      button {
        pointer-events: initial;
        border: none;
        border-radius: 50%;
        margin: 0 10px;
        padding: 4px;
        display: flex;
        cursor: pointer;
        align-items: center;
        justify-content: center;

        background-color: #21262e;
        fill: #f0f2f4;
        opacity: 0;

        transition: 0.2s;
      }

      .container:hover ~ .buttons button {
        opacity: 1;
      }

      .buttons:hover button,
      .buttons button:hover {
        opacity: 1;
      }

      button:focus {
        background-color: #ffffff;
        fill: #b9bfc8;
        outline: 4px solid #505965;
      }

      button.next {
        transform: rotate(180deg);
      }

      .buttons {
        position: absolute;
        transform: translateY(-50%);
        top: 50%;

        pointer-events: none;

        display: flex;
        align-items: center;
        justify-content: space-between;

        margin: 0 auto;

        width: 100%;
        max-width: 360px;
        max-height: 495px;
      }

      .container {
        display: flex;
        align-items: center;

        margin: 0 auto;
        overflow: hidden;

        max-width: 360px;
        max-height: 495px;

        border-radius: 10px;
        box-shadow: 0 0 8px 0 #21262e;
      }

      .container.img1 {
        justify-content: left;
      }

      .container.img2 {
        justify-content: center;
      }

      .container.img3 {
        justify-content: right;
      }

      .container.img1 ~ .buttons button.prev {
        opacity: 0;
        visibility: hidden;
      }

      .container.img3 ~ .buttons button.next {
        opacity: 0;
        visibility: hidden;
      }

      .container img {
        flex: 0 0 auto;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        object-fit: cover;
      }
    </style>

    <script>
      function next() {
        const container = document.querySelector(".container");
        if (container.classList.contains("img1")) {
          container.classList.remove("img1");
          container.classList.add("img2");
        } else if (container.classList.contains("img2")) {
          container.classList.remove("img2");
          container.classList.add("img3");
        }
      }

      function prev() {
        const container = document.querySelector(".container");

        if (container.classList.contains("img3")) {
          container.classList.remove("img3");
          container.classList.add("img2");
        } else if (container.classList.contains("img2")) {
          container.classList.remove("img2");
          container.classList.add("img1");
        }
      }
    </script>
  </head>
  <body>
    <div class="container img1">
      <img
        src="tinder-1.png"
        alt="Tinder profile for lightatorch on a black background, with text: 2020.galacticpuzzlehunt.com/_"
      />
      <img
        src="tinder-2.png"
        alt="Tinder profile for lightatorch on a teal and blue background, with text:
; Toughened, as metal
; Chair or bench, e.g.
; Food often eaten to break a Ramadan fast
; Some questions are off it
; Opportunity
; Fasten clothing, maybe
; It was legalized in Virginia earlier this month
; Staple food
; Bad thing to get while driving"
      />
      <img
        src="tinder-3.png"
        alt="Tinder profile for lightatorch on an orange and yellow background, with text: 
      Company that sells a lot of band T-shirts (5)
; Cooking method (2)
; Emotionally charged, as an issue (1)
; It might follow a Tinder chat (3)
; On a short fuse (3)
; Showy expert (2)
; Uncomfortable position to be in (3)
; Undesirable object (6)
; Very popular or in demand (4)"
      />
    </div>
    <div class="buttons">
      <button
        class="prev"
        onclick="prev()"
        aria-label="Previous Photo"
        type="button"
      >
        <svg
          focusable="false"
          role="presentation"
          viewBox="0 0 24 24"
          width="24px"
          height="24px"
        >
          <path
            class=""
            d="M13.98 20.717a1.79 1.79 0 0 0 2.685 0 1.79 1.79 0 0 0 0-2.684l-7.158-6.62 7.158-6.8a1.79 1.79 0 0 0 0-2.684 1.79 1.79 0 0 0-2.684 0L5.929 9.98a1.79 1.79 0 0 0 0 2.684l8.052 8.052z"
          ></path>
        </svg>
      </button>
      <button
        class="next"
        onclick="next()"
        aria-label="Next Photo"
        type="button"
      >
        <svg
          focusable="false"
          role="presentation"
          viewBox="0 0 24 24"
          width="24px"
          height="24px"
        >
          <path
            class=""
            d="M13.98 20.717a1.79 1.79 0 0 0 2.685 0 1.79 1.79 0 0 0 0-2.684l-7.158-6.62 7.158-6.8a1.79 1.79 0 0 0 0-2.684 1.79 1.79 0 0 0-2.684 0L5.929 9.98a1.79 1.79 0 0 0 0 2.684l8.052 8.052z"
          ></path>
        </svg>
      </button>
    </div>
  </body>
</html>
